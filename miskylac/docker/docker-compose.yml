services:
  mysql:
    image: mysql:8.4
    container_name: miskylac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: miskylac
      MYSQL_USER: miskylac_user
      MYSQL_PASSWORD: miskylac123
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data: